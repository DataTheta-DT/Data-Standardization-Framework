catalog: workspace
schema: lab_standardization
volume: lab_files
folders:
  raw: raw_reports
  fhir: fhir_bundles
  standardized: standardized_reports
  structured: structured_reports
llm:
  # How the LLM answer is combined with the rule-based parser:
  #   primary  = use the LLM rows (checked against the source text), fill gaps from rules
  #   fallback = rules first, LLM only when rules find nothing
  #   assist   = rules first, LLM adds rows the rules missed
  #   off      = rules only
  mode: primary
  temperature: 0
  max_tokens: 4096
  timeout_seconds: 120
  # Providers are tried in this order for every file. A provider without an API key is skipped, a provider that
  # fails (or answers with something unreadable) hands over to the next one. Remove a provider to take it out of
  # the chain; reorder them to change priority. LLM_PROVIDERS=gemini,groq in .env overrides this list.
  # Keys are read from the environment / .env (see .env). Models can be overridden there too (GEMINI_MODEL=...).
  providers:
    - name: huggingface
      model: Qwen/Qwen3-8B
      fallback_models:            # tried inside the same provider when the first model is not available
        - Qwen/Qwen3-32B
        - Qwen/Qwen2.5-72B-Instruct
        - meta-llama/Llama-3.3-70B-Instruct
        - meta-llama/Llama-3.1-8B-Instruct
        - openai/gpt-oss-20b
    - name: gemini
      model: gemini-2.5-flash
    - name: groq
      model: llama-3.3-70b-versatile
    - name: openrouter
      model: meta-llama/llama-3.3-70b-instruct
    - name: openai
      model: gpt-4o-mini
    # Also supported: ollama (local, no key), databricks (serving endpoint), openai_compatible (any /chat/completions
    # endpoint: set base_url here or OPENAI_COMPATIBLE_BASE_URL, plus OPENAI_COMPATIBLE_API_KEY and a model).
ocr:
  backend: auto
  min_pdf_chars_per_page: 40
  default_conf: 0.85
source_conf:
  hl7: 1.0
  csv: 0.99
  pdf_text: 0.97
thresholds:
  loinc_auto: 90
  loinc_review: 75
  loinc_margin: 5
  min_extraction_conf: 0.8
  loinc_warn_below: 90
  ratio_mismatch: 50
  loinc_rank_auto: 2000
  loinc_rank_margin: 1.5
  loinc_loose_rank_max: 300
  loinc_token_max_candidates: 60
  loinc_generic_max: 800
  default_specimen_systems: [Ser/Plas, Ser, Plas, Bld, Ser/Plas/Bld, Bld/Ser/Plas]
tables:
  bronze_reports: bronze_reports
  bronze_extractions: bronze_extractions
  silver_docs: silver_extracted_docs
  silver_rows: silver_extracted_rows
  silver_standardized: silver_standardized
  silver_results: silver_results
  gold_results: gold_lab_results
  gold_fhir: gold_fhir_resources
  ref_loinc: ref_loinc
